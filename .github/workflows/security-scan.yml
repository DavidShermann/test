name: Security Scan CI

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci || npm install
        else
          echo "No package.json found, skipping dependency installation"
        fi

    - name: Run npm audit
      id: npm-audit
      continue-on-error: true
      run: |
        if [ -f package.json ]; then
          echo "Running npm audit..."
          npm audit --json > npm-audit-report.json || true
          npm audit > npm-audit-report.txt || true
          cat npm-audit-report.txt
        else
          echo "No package.json found, skipping npm audit"
        fi

    - name: Install and run Snyk security scan
      continue-on-error: true
      run: |
        if [ -f package.json ]; then
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }} || echo "Snyk token not configured, skipping authenticated scan"
          snyk test --json > snyk-report.json || true
          snyk test || true
        else
          echo "No package.json found, skipping Snyk scan"
        fi
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Run OWASP Dependency-Check
      continue-on-error: true
      run: |
        if [ -f package.json ]; then
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip dependency-check-9.0.9-release.zip
          ./dependency-check/bin/dependency-check.sh \
            --project "Node.js Security Scan" \
            --scan . \
            --format ALL \
            --out ./dependency-check-report \
            --prettyPrint
          echo "OWASP Dependency-Check completed"
        else
          echo "No package.json found, skipping OWASP scan"
        fi

    - name: Run npm outdated check
      continue-on-error: true
      run: |
        if [ -f package.json ]; then
          npm outdated > outdated-packages.txt || true
          cat outdated-packages.txt
        else
          echo "No package.json found, skipping outdated check"
        fi

    - name: Check for known vulnerable packages
      continue-on-error: true
      run: |
        if [ -f package-lock.json ]; then
          echo "Checking package-lock.json for known vulnerabilities..."
          npm audit fix --dry-run || true
        fi

    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Date: $(date)" >> security-summary.md
        echo "## Node Version: ${{ matrix.node-version }}" >> security-summary.md
        echo "" >> security-summary.md

        if [ -f npm-audit-report.txt ]; then
          echo "## NPM Audit Results" >> security-summary.md
          echo '```' >> security-summary.md
          cat npm-audit-report.txt >> security-summary.md
          echo '```' >> security-summary.md
        fi

        if [ -f outdated-packages.txt ]; then
          echo "## Outdated Packages" >> security-summary.md
          echo '```' >> security-summary.md
          cat outdated-packages.txt >> security-summary.md
          echo '```' >> security-summary.md
        fi

        cat security-summary.md

    - name: Upload security reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-node-${{ matrix.node-version }}
        path: |
          npm-audit-report.json
          npm-audit-report.txt
          snyk-report.json
          dependency-check-report/
          outdated-packages.txt
          security-summary.md
        retention-days: 30

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('dependency-check-report/dependency-check-report.sarif') != ''
      with:
        sarif_file: dependency-check-report/dependency-check-report.sarif
        category: dependency-check

    - name: Fail job if critical vulnerabilities found
      run: |
        if [ -f npm-audit-report.json ]; then
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found! Failing the build."
            exit 1
          fi

          if [ "$HIGH" -gt 5 ]; then
            echo "⚠️  More than 5 high vulnerabilities found! Failing the build."
            exit 1
          fi
        fi

        echo "✅ Security scan completed successfully"

  build-and-publish-artifact:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci || npm install
        fi

    - name: Run tests
      continue-on-error: true
      run: |
        if [ -f package.json ]; then
          npm test || echo "No tests configured"
        fi

    - name: Build application
      run: |
        if [ -f package.json ]; then
          npm run build || echo "No build script configured"
        fi

    - name: Create artifact bundle
      run: |
        mkdir -p artifacts
        tar -czf artifacts/app-bundle-${{ github.sha }}.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=artifacts \
          .
        echo "Artifact created: app-bundle-${{ github.sha }}.tar.gz"
        ls -lh artifacts/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nodejs-app-${{ github.sha }}
        path: artifacts/
        retention-days: 90

    - name: Create Release Asset (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/app-bundle-${{ github.sha }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
